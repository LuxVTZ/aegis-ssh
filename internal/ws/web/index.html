<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aegis Control Panel</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <nav class="sidebar">
            <div class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                <span>Aegis</span>
            </div>
            <ul class="nav-links">
                <li><a href="#dashboard" class="nav-item active" data-target="dashboard">Dashboard</a></li>
                <li><a href="#servers" class="nav-item" data-target="servers">Servers</a></li>
                <li><a href="#audit" class="nav-item" data-target="audit">Audit Logs</a></li>
                <li><a href="#tunnels" class="nav-item" data-target="tunnels">Tunnels</a></li>
            </ul>
        </nav>

        <!-- Main Content -->
        <main class="content">
            <!-- DASHBOARD SECTION -->
            <div id="section-dashboard" class="page-section active-section">
                <header class="topbar">
                    <h1>Overview</h1>
                    <div class="status-badge"><span class="dot"></span> Online</div>
                </header>

                <div class="dashboard-grid">
                    <div class="card stat-card">
                        <h3>Servers</h3>
                        <div class="value" id="stat-servers">0</div>
                    </div>
                    <div class="card stat-card">
                        <h3>Tunnels</h3>
                        <div class="value">0</div>
                    </div>
                    <div class="card stat-card">
                        <h3>Commands</h3>
                        <div class="value" id="stat-cmds">0</div>
                    </div>
                </div>
            </div>

            <!-- SERVERS SECTION -->
            <div id="section-servers" class="page-section">
                <header class="topbar">
                    <h1>Servers</h1>
                </header>
                <div class="card list-card">
                    <div class="table-container">
                        <table id="servers-table">
                            <thead>
                                <tr>
                                    <th>Name</th>
                                    <th>Host</th>
                                    <th>User</th>
                                    <th>Tags</th>
                                    <th>Status</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- AUDIT LOGS SECTION -->
            <div id="section-audit" class="page-section">
                <header class="topbar">
                    <h1>Audit Logs</h1>
                </header>
                <div class="card list-card">
                    <div class="table-container">
                        <table id="audit-table">
                            <thead>
                                <tr>
                                    <th>Time</th>
                                    <th>Host</th>
                                    <th>Command</th>
                                    <th>Status</th>
                                    <th>Speed</th>
                                </tr>
                            </thead>
                            <tbody>
                                <!-- Populated by JS -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

            <!-- TUNNELS SECTION -->
            <div id="section-tunnels" class="page-section">
                <header class="topbar">
                    <h1>Active Tunnels</h1>
                </header>
                <div class="card list-card">
                    <div class="empty-state">
                        <p>No active remote tunnels.</p>
                        <span class="subtext">Use the MCP tool tunnel_expose to create one.</span>
                    </div>
                </div>
            </div>

        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
