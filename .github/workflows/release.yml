name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        os: [linux, windows, darwin]
        arch: [amd64, arm64]
    
    steps:
    - uses: actions/checkout@v3
    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.21'
    
    - name: Build
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: |
        ext=""
        if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
        go build -o aegis-ssh-${{ matrix.os }}-${{ matrix.arch }}$ext ./cmd/aegis-ssh
        
    - name: Release
      uses: softprops/action-gh-release@v1
      with:
        files: aegis-ssh-*
